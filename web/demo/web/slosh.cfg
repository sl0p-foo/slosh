/* The VM the page boots. TinyEMU's own config format -- JSON with unquoted
   keys, trailing commas and C comments -- read by the emulator over HTTP.
   Paths are relative to this file.

   drive0 is a virtio block device rather than an initrd on purpose: Bellard's
   prebuilt riscv64 kernel is built without CONFIG_BLK_DEV_INITRD, so an
   `initrd:` line here is accepted, ignored, and then the kernel panics with
   "Unable to mount root fs". blk.txt is the block index; the .bin blocks
   beside it are fetched lazily, 256 KiB at a time, as the guest reads them.

   No eth0: nothing in this demo wants the network, and leaving the driver out
   means no websocket relay is contacted. */
{
    version: 1,
    machine: "riscv64",
    memory_size: 128,
    bios: "bbl64.bin",
    kernel: "kernel-riscv64.bin",
    cmdline: "console=hvc0 root=/dev/vda rw",
    drive0: { file: "rootfs/blk.txt" },
}
